<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meensha · Register for Offers</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --gold: #8B6914;
    --gold-light: #C9A84C;
    --cream: #F7F3EC;
    --dark: #0E0A04;
    --dark2: #1A1208;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    background: var(--dark);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: var(--dark2);
    border: 1px solid rgba(201,168,76,0.25);
    border-radius: 12px;
    padding: 32px 28px;
    text-align: center;
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    color: var(--gold-light);
    margin-bottom: 4px;
  }
  .sub { font-size: 14px; color: rgba(247,243,236,0.6); margin-bottom: 24px; }
  input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 6px;
    color: var(--cream);
    font-family: inherit;
    font-size: 16px;
  }
  input:focus { outline: none; border-color: var(--gold-light); }
  button {
    width: 100%;
    padding: 13px;
    background: var(--gold);
    color: var(--cream);
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
  }
  button:hover { background: var(--gold-light); color: var(--dark); }
  button:disabled { opacity: 0.5; cursor: default; }
  .error { color: #e08a8a; font-size: 13px; margin-top: 8px; display: none; }
  .result { display: none; }
  .result .code {
    font-size: 32px;
    font-weight: 700;
    color: var(--gold-light);
    letter-spacing: 1px;
    margin: 16px 0 8px;
    font-family: monospace;
  }
  .result .discount { font-size: 18px; margin-bottom: 8px; }
  .result .expiry { font-size: 13px; color: rgba(247,243,236,0.6); margin-bottom: 16px; }
  .result .note { font-size: 13px; color: rgba(247,243,236,0.7); border-top: 1px solid rgba(201,168,76,0.2); padding-top: 16px; }
  img.logo { display: block; width: 160px; max-width: 60%; margin: 0 auto 16px; }
  .wa-row { display: flex; align-items: center; margin-bottom: 10px; }
  .pfx { padding: 12px; border: 1px solid var(--gold); border-right: none; border-radius: 6px 0 0 6px; background: var(--dark2); color: var(--gold-light); font-weight: 700; }
  .wa-row input { flex: 1; border-radius: 0 6px 6px 0; margin-bottom: 0; }
  .ig-overlay {
    position: fixed; inset: 0; z-index: 100; background: var(--dark);
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
  }
  .ig-panel { width: 100%; max-width: 360px; text-align: center; }
  a.ig-btn {
    display: block; width: 100%; padding: 13px; margin-bottom: 14px;
    background: linear-gradient(135deg,#f58529,#dd2a7b,#8134af,#515bd4);
    color: #fff; border-radius: 6px; text-decoration: none; font-weight: 600;
    box-sizing: border-box;
  }
  .ig-panel .hint { font-size: 13px; color: rgba(247,243,236,0.6); margin-bottom: 16px; }
  .save-btn {
    display: block; box-sizing: border-box; width: 100%; margin: 12px 0 16px; padding: 13px;
    background: var(--gold); color: var(--dark); border-radius: 6px; text-decoration: none;
    font-weight: 600; text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <div id="form-view">
    <img class="logo" src="meensha_rotating_logo.webp" alt="Meensha">
    <div class="sub">Register now and get an exclusive discount code</div>
    <input id="reg-name" placeholder="Your name" autocomplete="name">
    <div class="wa-row"><span class="pfx">+91</span><input id="reg-wa" placeholder="10-digit mobile number" autocomplete="tel-national" inputmode="numeric" maxlength="14"></div>
    <input id="reg-ig" placeholder="Your Instagram handle (e.g. @yourname)" autocomplete="off" style="display:none">
    <button id="reg-submit" onclick="submitRegistration()">Get My Code</button>
    <div class="error" id="reg-error"></div>
  </div>
  <div id="ig-overlay" class="ig-overlay" style="display:none;">
    <div class="ig-panel" id="ig-step-follow">
      <img class="logo" src="meensha_rotating_logo.webp" alt="Meensha">
      <p class="hint">Follow us on Instagram to unlock your code.</p>
      <a class="ig-btn" href="https://instagram.com/meensha_fabrics" target="_blank" rel="noopener">📸 Follow @meensha_fabrics</a>
      <button onclick="showIgHandleStep()">I've followed — continue</button>
    </div>
    <div class="ig-panel" id="ig-step-handle" style="display:none;">
      <h1>Thanks!</h1>
      <p class="hint">Enter your Instagram handle to continue.</p>
      <div class="wa-row"><span class="pfx">@</span><input id="ig-handle-input" placeholder="yourhandle" autocomplete="off" autocapitalize="none"></div>
      <div class="error" id="ig-error"></div>
      <button onclick="confirmIgHandle()">Continue</button>
    </div>
  </div>
  <div class="result" id="result-view">
    <h1 id="result-heading">You're registered!</h1>
    <div class="discount" id="result-discount"></div>
    <div class="code" id="result-code"></div>
    <div class="qr-box"><img id="result-qr" alt="QR for your code" width="200" height="200" style="display:none;background:#fff;padding:8px;border-radius:6px;"></div>
    <a id="result-qr-save" class="save-btn" style="display:none;" download="meensha-code.png">⬇️ Save QR image</a>
    <div class="expiry" id="result-expiry"></div>
    <div class="note">Show this code to our team at checkout to apply your discount.</div>
  </div>
</div>

<script src="qrcode.js"></script>
<script>
// Rendered locally (not a remote image) so the QR can be saved as a PNG.
function renderCodeQr(code){
  try{
    const qr = qrcode(0, 'M');
    qr.addData(code);
    qr.make();
    // Draw to a canvas and export a real PNG (the library's own data URL is a
    // GIF, which would be saved under a .png name).
    const n = qr.getModuleCount(), cell = 8, margin = 2;
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = (n + margin * 2) * cell;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      if (qr.isDark(r, c)) ctx.fillRect((c + margin) * cell, (r + margin) * cell, cell, cell);
    }
    const url = canvas.toDataURL('image/png');
    const img = document.getElementById('result-qr');
    img.src = url;
    img.style.display = 'block';
    const save = document.getElementById('result-qr-save');
    save.href = url;
    save.download = 'meensha-' + code + '.png';
    save.style.display = 'block';
  }catch(e){
    // QR is a convenience — the code itself is still shown above.
  }
}
const _SB ='https://eglanmhhcccsuhbxywua.supabase.co';
const _SK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnbGFubWhoY2Njc3VoYnh5d3VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4Nzc2MDQsImV4cCI6MjA5MDQ1MzYwNH0.0qjzkMVVajqMkx7SM-hhd6J62zVVFduVDbdr6juiNgo';

// ?event=<id> switches this page from the generic stall-registration form
// (fixed 5% code) to an event-scoped one — a specific event's own
// discount/region, created via admin.html or either Telegram bot.
// ?event=current is the permanent QR target: it resolves to the newest active
// event/promo (get_current_voucher_event), so printed QRs never go stale.
let eventId = new URLSearchParams(location.search).get('event');
let currentEvent = null;

async function initEventMode() {
  if (!eventId) return;
  const isCurrent = eventId === 'current';
  const res = await fetch(`${_SB}/rest/v1/rpc/${isCurrent ? 'get_current_voucher_event' : 'get_voucher_event'}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'apikey': _SK, 'Authorization': 'Bearer ' + _SK },
    body: JSON.stringify(isCurrent ? {} : { p_event_id: eventId })
  });
  const ev = await res.json().catch(() => null);
  if (!ev || !ev.id || ev.active === false) {
    const msg = isCurrent ? 'No offer is running right now — please check back soon.' : 'This event link is no longer active.';
    document.getElementById('form-view').innerHTML = '<img class="logo" src="meensha_rotating_logo.webp" alt="Meensha"><div class="sub">' + msg + '</div>';
    return;
  }
  eventId = ev.id;
  currentEvent = ev;
  const discTxt = ev.discount_type === 'percent' ? ev.discount_value + '% off' : (ev.region === 'australia' ? 'A$' : '₹') + ev.discount_value + ' off';
  document.querySelector('.sub').textContent = `${ev.title} — register now and get ${discTxt}`;
  // Honor-system follow gate — no Instagram API access to verify a real
  // follow. Full-page Follow screen first; after 10 seconds it becomes the
  // handle dialog. Staff check the follow on the kiosk after the code is made.
  if (ev.requires_instagram) showIgFollowStep();
}
initEventMode();

function showIgFollowStep() {
  document.getElementById('ig-overlay').style.display = 'flex';
}

function showIgHandleStep() {
  document.getElementById('ig-step-follow').style.display = 'none';
  document.getElementById('ig-step-handle').style.display = 'block';
  document.getElementById('ig-handle-input').focus();
}

function confirmIgHandle() {
  const handle = document.getElementById('ig-handle-input').value.trim().replace(/^@+/, '');
  const errEl = document.getElementById('ig-error');
  if (!/^[A-Za-z0-9._]{1,30}$/.test(handle)) {
    errEl.textContent = 'Enter a valid Instagram handle.';
    errEl.style.display = 'block';
    return;
  }
  document.getElementById('reg-ig').value = '@' + handle;
  document.getElementById('ig-overlay').style.display = 'none';
  document.querySelector('.sub').textContent = 'Thanks! Just one more step — your details below.';
}

async function submitRegistration() {
  const name = document.getElementById('reg-name').value.trim();
  const wa = document.getElementById('reg-wa').value.replace(/\D/g, '');
  const instagram = document.getElementById('reg-ig').value.trim();
  const errEl = document.getElementById('reg-error');
  errEl.style.display = 'none';

  if (!name || !wa) {
    errEl.textContent = 'Please enter both your name and WhatsApp number.';
    errEl.style.display = 'block';
    return;
  }
  if (wa.length !== 10) {
    errEl.textContent = 'Enter your 10-digit WhatsApp number (we add +91 for you).';
    errEl.style.display = 'block';
    return;
  }
  if (eventId && currentEvent && currentEvent.requires_instagram && !instagram) {
    errEl.textContent = 'Please enter your Instagram handle (after following us).';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('reg-submit');
  btn.disabled = true;
  btn.textContent = 'Registering...';

  try {
    const rpc = eventId ? 'register_event_visitor' : 'register_visitor';
    // p_email is sent blank: the RPC signature still has p_email without a
    // default, so omitting it makes PostgREST return 404 (PGRST202).
    const body = eventId ? { p_event_id: eventId, p_name: name, p_wa: wa, p_email: '', p_instagram: instagram || null } : { p_name: name, p_wa: wa };
    const res = await fetch(`${_SB}/rest/v1/rpc/${rpc}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': _SK, 'Authorization': 'Bearer ' + _SK },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if (!res.ok || data.error) {
      errEl.textContent = data.error || 'Something went wrong — please try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Get My Code';
      return;
    }

    document.getElementById('form-view').style.display = 'none';
    document.getElementById('result-view').style.display = 'block';
    document.getElementById('result-heading').textContent = data.already_registered ? 'Welcome back!' : "You're registered!";
    const sym = currentEvent && currentEvent.region === 'australia' ? 'A$' : '₹';
    document.getElementById('result-discount').textContent = data.discount_type === 'flat' ? sym + data.discount_value + ' off your order' : data.discount_value + '% off your order';
    document.getElementById('result-code').textContent = data.code;
    renderCodeQr(data.code);
    document.getElementById('result-expiry').textContent = 'Valid until ' + new Date(data.valid_until).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch (e) {
    errEl.textContent = 'Could not connect — please check your internet and try again.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Get My Code';
  }
}
</script>
</body>
</html>
