<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meensha · Voucher Generator</title>
<style>
:root{--gold:#C9A84C;--gdk:#8B6914;--dark:#1A1208;--d2:#2A1F0E;--cream:#F7F3EC;--bd:#e0d5c0;--bg:#fdfaf4;--wh:#fff;--red:#e74c3c;--grn:#27ae60;--gy:#95a5a6;--sh:0 2px 12px rgba(139,105,20,.1);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:#2d2d2d;font-size:14px;}
.tb{background:var(--dark);color:var(--cream);padding:10px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.tb-logo{font-family:Georgia,serif;font-size:17px;color:var(--gold);}
.tb-back{color:var(--gold);font-size:12px;text-decoration:none;}
.wrap{max-width:1180px;margin:0 auto;padding:20px;}
.card{background:var(--wh);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:var(--sh);}
.ct{font-size:13px;font-weight:700;color:var(--dark);margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:7px;}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px;margin-bottom:12px;}
.fi{display:flex;flex-direction:column;gap:3px;}
.fi label{font-size:10px;font-weight:700;color:var(--gdk);text-transform:uppercase;letter-spacing:.1em;}
.fi input,.fi select{padding:7px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;font-family:inherit;background:#fafaf8;outline:none;}
.fi input:focus,.fi select:focus{border-color:var(--gold);background:#fff;}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;}
.bg{background:var(--gdk);color:#fff;}.bg:hover{background:var(--dark);}
.bgn{background:var(--grn);color:#fff;}.bgn:hover{background:#1e9146;}
.bgy{background:#ecf0f1;color:#2d2d2d;border:1px solid var(--bd);}
.summary{font-size:12px;color:#555;background:#faf7f0;border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin-bottom:14px;line-height:1.6;}
.summary b{color:var(--dark);}
#CANVAS-WRAP{display:flex;justify-content:center;background:#efe9db;border-radius:8px;padding:16px;overflow:auto;}
#V-CANVAS{max-width:100%;box-shadow:0 6px 24px rgba(0,0,0,.25);}
.err{color:var(--red);font-size:13px;padding:10px;background:#fff0f0;border-radius:6px;margin-bottom:12px;}
.toast{position:fixed;bottom:18px;right:18px;background:#2d2d2d;color:#fff;padding:10px 16px;border-radius:7px;font-size:12px;border-left:4px solid var(--gold);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>
<div class="tb"><span class="tb-logo">Meensha · Voucher Generator</span><a class="tb-back" href="admin.html">← Back to Admin</a></div>
<div class="wrap">
  <div id="GATE-ERR" class="card err" style="display:none;">Not logged in. <a href="admin.html">Go to admin login</a>.</div>

  <div id="LOOKUP-CARD" class="card" style="display:none;">
    <div class="ct">🔎 Find a Coupon</div>
    <div class="fg">
      <div class="fi"><label>Coupon Code</label><input id="LK-CODE" placeholder="e.g. VIP-001" style="text-transform:uppercase;"></div>
    </div>
    <button class="btn bg" onclick="lookupByCode()">Load Coupon</button>
    <div id="LK-ERR" class="err" style="display:none;margin-top:10px;"></div>
  </div>

  <div id="GEN-CARD" class="card" style="display:none;">
    <div class="ct">🖼️ Voucher Details</div>
    <div class="summary" id="COUPON-SUMMARY"></div>
    <div class="fg">
      <div class="fi"><label>Voucher Type</label>
        <select id="VT-TYPE" onchange="onVtTypeChange()">
          <option value="individual">Individual Discount</option>
          <option value="partner">Partner Offer</option>
          <option value="event">Event Offer</option>
        </select>
      </div>
      <div class="fi" id="VT-NAME-FI"><label id="VT-NAME-LBL">Customer Name (optional)</label><input id="VT-NAME" placeholder=""></div>
      <div class="fi"><label>QR Type</label>
        <select id="QR-TYPE" onchange="onQrTypeChange()">
          <option value="website">Website (meensha.in)</option>
          <option value="telegram">Telegram deep link (staff scan)</option>
        </select>
      </div>
      <div class="fi" id="QR-BOT-FI" style="display:none;"><label>Telegram Bot</label>
        <select id="QR-BOT">
          <option value="india">India (Shalini)</option>
          <option value="australia">Australia (Meenakshi)</option>
        </select>
      </div>
    </div>
    <button class="btn bgn" onclick="renderVoucher()">🔄 Render Preview</button>
    <button class="btn bgy" style="margin-left:6px;" onclick="downloadVoucher()">⬇️ Download PNG</button>
  </div>

  <div id="CANVAS-CARD" class="card" style="display:none;">
    <div class="ct">Preview</div>
    <div id="CANVAS-WRAP"><canvas id="V-CANVAS" width="1200" height="700"></canvas></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
//---------------------------------------------------------------------
// QR Code Generator for JavaScript — vendored inline (no external CDN;
// this project runs on GitHub Pages with no build step and avoids
// runtime CDN dependencies for its own pages).
//
// Copyright (c) 2009 Kazuhiko Arase
// URL: http://www.d-project.com/
// Licensed under the MIT license: http://www.opensource.org/licenses/mit-license.php
// The word 'QR Code' is registered trademark of DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
// Source: https://github.com/kazuhikoarase/qrcode-generator (js/qrcode.js)
//---------------------------------------------------------------------
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

// Telegram QR is only ambiguous (which bot?) when the coupon's region is
// 'all' — india/australia-scoped coupons always map to exactly one bot, so
// the bot picker only needs to show up in that one case.
function onQrTypeChange(){
  const t=document.getElementById('QR-TYPE').value;
  const showBot=t==='telegram'&&currentCoupon&&currentCoupon.region==='all';
  document.getElementById('QR-BOT-FI').style.display=showBot?'flex':'none';
}

function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
}

function drawRoundedRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawDashedRect(ctx,x,y,w,h,r,dash){
  ctx.save();
  ctx.setLineDash(dash||[8,6]);
  drawRoundedRect(ctx,x,y,w,h,r);
  ctx.stroke();
  ctx.restore();
}

// Four simple L-shaped brackets at the corners of (x,y,w,h), pointing
// inward — pure canvas drawing, no image asset.
function drawCornerBrackets(ctx,x,y,w,h,len,color,lw){
  ctx.save();
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='square';
  [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([cx,cy,dx,dy])=>{
    ctx.beginPath();
    ctx.moveTo(cx,cy+len*dy);
    ctx.lineTo(cx,cy);
    ctx.lineTo(cx+len*dx,cy);
    ctx.stroke();
  });
  ctx.restore();
}

// Builds a "torn ribbon" path for the code box: flat top/bottom, jagged
// sawtooth left/right edges. Caller fills/strokes the returned path.
function ribbonPath(ctx,x,y,w,h,tooth){
  const teeth=Math.max(3,Math.round(h/tooth));
  const step=h/teeth;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+w,y);
  for(let i=0;i<teeth;i++){
    const yMid=y+step*i+step/2, yEnd=y+step*(i+1);
    const out=(i%2===0)?tooth/2:-tooth/2;
    ctx.lineTo(x+w+out,yMid);
    ctx.lineTo(x+w,yEnd);
  }
  ctx.lineTo(x,y+h);
  for(let i=teeth-1;i>=0;i--){
    const yMid=y+step*i+step/2, yStart=y+step*i;
    const out=(i%2===0)?-tooth/2:tooth/2;
    ctx.lineTo(x+out,yMid);
    ctx.lineTo(x,yStart);
  }
  ctx.closePath();
}

// Simple decorative footer icons — drawn as plain shapes (not the official
// Instagram/WhatsApp glyphs) so there's no logo asset or trademark to pull
// in, and no external network request.
function drawGlobeIcon(ctx,cx,cy,r,color){
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=1.6;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx-r,cy);ctx.lineTo(cx+r,cy);ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx,cy,r*0.45,r,0,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
function drawInstaIcon(ctx,cx,cy,size,color){
  ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=1.6;
  drawRoundedRect(ctx,cx-size/2,cy-size/2,size,size,size*0.28);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,size*0.26,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(cx+size*0.28,cy-size*0.28,size*0.07,0,Math.PI*2);ctx.fill();
  ctx.restore();
}
function drawWhatsIcon(ctx,cx,cy,r,color){
  ctx.save();ctx.strokeStyle=color;ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.arc(cx,cy,r,Math.PI*0.15,Math.PI*1.85);
  ctx.lineTo(cx-r*0.1,cy+r*1.25);
  ctx.lineTo(cx+r*0.45,cy+r*0.55);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

async function renderVoucher(){
  if(!currentCoupon)return;
  const c=currentCoupon;
  const vType=document.getElementById('VT-TYPE').value;
  const vName=document.getElementById('VT-NAME').value.trim();

  const canvas=document.getElementById('V-CANVAS');
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;

  // Background
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,'#1A1208');
  grad.addColorStop(1,'#0E0A04');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  // Double gold border + simple corner brackets (pure canvas drawing)
  ctx.strokeStyle='#8B6914';
  ctx.lineWidth=2;
  ctx.strokeRect(14,14,W-28,H-28);
  ctx.strokeStyle='#C9A84C';
  ctx.lineWidth=1;
  ctx.strokeRect(26,26,W-52,H-52);
  drawCornerBrackets(ctx,14,14,W-28,H-28,30,'#E8D5A3',3);

  // Logo (top-left)
  try{
    const logo=await loadImage('meensha_logo_eng.png');
    const logoSize=84;
    ctx.drawImage(logo,46,42,logoSize,logoSize);
  }catch(e){/* logo optional — continue without it */}

  // Tagline under logo
  ctx.fillStyle='#C9A84C';
  ctx.font='italic 15px Georgia, serif';
  ctx.textAlign='left';
  ctx.fillText('Heritage Weaves of India',46,150);

  let y=150;

  // Badge line for partner/event
  if(vType==='partner'||vType==='event'){
    y=190;
    const badgeText=vType==='partner'?'PARTNER OFFER':'EVENT OFFER';
    ctx.font='bold 13px Arial, sans-serif';
    const badgeW=ctx.measureText(badgeText).width+28;
    ctx.fillStyle='#8B6914';
    drawRoundedRect(ctx,46,y-20,badgeW,30,15);
    ctx.fill();
    ctx.fillStyle='#1A1208';
    ctx.textAlign='left';
    ctx.fillText(badgeText,46+14,y);
    if(vName){
      ctx.fillStyle='#E8D5A3';
      ctx.font='600 20px Georgia, serif';
      ctx.fillText(vName,46+badgeW+16,y+2);
    }
    y+=46;
  } else {
    y=190;
    if(vName){
      ctx.fillStyle='#E8D5A3';
      ctx.font='600 18px Georgia, serif';
      ctx.fillText(vName,46,y);
      y+=36;
    }
  }

  // Headline — discount
  const symbol=c.region==='australia'?'A$':'₹';
  const headline=c.discount_type==='percent'?`${c.discount_value}% OFF`:`${symbol}${c.discount_value} OFF`;
  ctx.fillStyle='#E8D5A3';
  ctx.font='bold 76px Georgia, serif';
  ctx.textAlign='left';
  ctx.fillText(headline,46,y+90);
  y+=120;

  // Code "ribbon" — parchment background, jagged torn-paper edges,
  // dashed gold inner border.
  const boxW=480,boxH=72;
  ribbonPath(ctx,46,y,boxW,boxH,14);
  ctx.fillStyle='#EDE4CF';
  ctx.fill();
  ctx.save();
  ctx.setLineDash([9,7]);
  ctx.strokeStyle='#8B6914';
  ctx.lineWidth=1.5;
  ribbonPath(ctx,46,y,boxW,boxH,14);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle='#1A1208';
  ctx.font='bold 34px "Courier New", monospace';
  ctx.textAlign='center';
  ctx.fillText(c.code,46+boxW/2,y+46);
  y+=boxH+34;

  // Instructions
  ctx.textAlign='left';
  ctx.fillStyle='#E8D5A3';
  ctx.font='14px Arial, sans-serif';
  const qrType=document.getElementById('QR-TYPE').value;
  ctx.fillText(qrType==='telegram'?'At a stall: show this to staff — they’ll scan it to apply your discount.':'Online: scan the QR, or enter the code at checkout on meensha.in.',46,y);
  y+=22;
  ctx.fillText('Offline: show this voucher or quote the code to staff.',46,y);
  y+=30;

  // Validity + single-use
  ctx.fillStyle='#C9A84C';
  ctx.font='13px Arial, sans-serif';
  const valid=[c.valid_from,c.valid_until].filter(Boolean).join(' to ');
  ctx.fillText(valid?`Valid ${valid}`:'No expiry date',46,y);
  y+=20;
  if(c.single_use){
    ctx.fillText('One-time use only.',46,y);
    y+=20;
  }

  // QR panel (white, right side)
  const qrPanelSize=260;
  const qrPanelX=W-qrPanelSize-70;
  const qrPanelY=120;
  ctx.fillStyle='#ffffff';
  drawRoundedRect(ctx,qrPanelX,qrPanelY,qrPanelSize,qrPanelSize,14);
  ctx.fill();

  // Website QR keeps encoding the online path (verified/working already).
  // Telegram QR instead deep-links into the matching bot's kiosk flow (see
  // telegram-bot(-au)/index.ts's coupon_<code> /start payload) — region
  // india/australia map to exactly one bot each; region='all' uses QR-BOT.
  const botUsername=c.region==='australia'?'meenshaozbot':c.region==='india'?'meenshashalbot':
    (document.getElementById('QR-BOT').value==='australia'?'meenshaozbot':'meenshashalbot');
  const qrData=qrType==='telegram'
    ?`https://t.me/${botUsername}?start=coupon_${encodeURIComponent(c.code)}`
    :`https://meensha.in/?coupon=${encodeURIComponent(c.code)}`;
  const qr=qrcode(0,'M');
  qr.addData(qrData);
  qr.make();
  const moduleCount=qr.getModuleCount();
  const qrMargin=18;
  const cellSize=(qrPanelSize-qrMargin*2)/moduleCount;
  ctx.fillStyle='#000000';
  for(let row=0;row<moduleCount;row++){
    for(let col=0;col<moduleCount;col++){
      if(qr.isDark(row,col)){
        ctx.fillRect(qrPanelX+qrMargin+col*cellSize,qrPanelY+qrMargin+row*cellSize,cellSize,cellSize);
      }
    }
  }
  ctx.fillStyle='#1A1208';
  ctx.font='11px Arial, sans-serif';
  ctx.textAlign='center';
  ctx.fillText('Scan to redeem',qrPanelX+qrPanelSize/2,qrPanelY+qrPanelSize+22);

  // Footer bar — icon + text pairs (website / Instagram / WhatsApp)
  const footX=26,footW=W-52,footH=56,footY=H-26-footH;
  ctx.fillStyle='#120D06';
  drawRoundedRect(ctx,footX,footY,footW,footH,8);
  ctx.fill();
  ctx.strokeStyle='rgba(139,105,20,0.5)';
  ctx.lineWidth=1;
  drawRoundedRect(ctx,footX,footY,footW,footH,8);
  ctx.stroke();

  const footItems=[{icon:'globe',text:'meensha.in'},{icon:'insta',text:'@meensha_fabrics'}];
  if(c.region==='india'||c.region==='all'){if(settingsByKey.wa_num_in)footItems.push({icon:'whats',text:settingsByKey.wa_num_in});}
  if(c.region==='australia'||c.region==='all'){if(settingsByKey.wa_num_au)footItems.push({icon:'whats',text:settingsByKey.wa_num_au});}

  const footCy=footY+footH/2;
  const itemGap=footW/footItems.length;
  footItems.forEach((item,i)=>{
    const iconCx=footX+itemGap*i+30;
    if(item.icon==='globe')drawGlobeIcon(ctx,iconCx,footCy,11,'#C9A84C');
    else if(item.icon==='insta')drawInstaIcon(ctx,iconCx,footCy,20,'#C9A84C');
    else drawWhatsIcon(ctx,iconCx,footCy,11,'#C9A84C');
    ctx.textAlign='left';
    ctx.fillStyle='#E8D5A3';
    ctx.font='13px Arial, sans-serif';
    ctx.fillText(item.text,iconCx+22,footCy+4);
  });
}

function downloadVoucher(){
  const canvas=document.getElementById('V-CANVAS');
  const link=document.createElement('a');
  const code=currentCoupon?currentCoupon.code:'voucher';
  link.download=`meensha-voucher-${code}.png`;
  link.href=canvas.toDataURL('image/png');
  link.click();
}

(async function(){
  if(!initGate())return;
  await loadSettings();
  document.getElementById('LOOKUP-CARD').style.display='block';

  // Handoff from admin.html's "Generate Voucher Image" button (preferred —
  // uses the coupon row admin_create_coupon just returned, no extra fetch).
  const pending=sessionStorage.getItem('MSN_VOUCHER_PENDING');
  if(pending){
    sessionStorage.removeItem('MSN_VOUCHER_PENDING');
    try{setCoupon(JSON.parse(pending));}catch(e){}
    return;
  }

  // Deep-link support: admin-voucher.html?code=XYZ looks the coupon up via
  // admin_list_coupons (same RPC the Coupons tab already uses).
  const params=new URLSearchParams(window.location.search);
  const codeParam=params.get('code');
  if(codeParam){
    document.getElementById('LK-CODE').value=codeParam.toUpperCase();
    await lookupByCode();
  }
})();
</script>
