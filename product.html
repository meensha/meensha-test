<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saree — Meensha</title>
<meta name="description" content="Handloom and heritage sarees from Meensha, sourced weaver-direct.">
<link rel="canonical" href="https://meensha.in/product.html">
<meta property="og:type" content="product">
<meta property="og:site_name" content="Meensha">
<meta property="og:title" content="Saree — Meensha">
<meta property="og:image" content="https://meensha.in/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://eglanmhhcccsuhbxywua.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sarees/weave.css">
</head>
<body>
<header class="wv-nav">
  <a href="./"><img src="navbar_80.webp" alt="Meensha" width="52" height="52"></a>
  <nav><a href="sarees/">All weaves</a><a href="about.html">About</a><a href="./#catalogue">Shop</a></nav>
</header>
<main class="wv-main">
  <nav class="wv-crumbs" aria-label="Breadcrumb"><a href="./">Home</a> › <a href="sarees/">Sarees</a> › <span id="pd-crumb">Saree</span></nav>
  <div id="pd-root"><p class="wv-empty">Loading…</p></div>
</main>
<footer class="wv-foot">Meensha · करघों की विरासत · <a href="https://wa.me/918709525218">WhatsApp</a> · <a href="mailto:meensha.fabrics@gmail.com">Email</a></footer>
<script>
// One page for every SKU (?id=<inventory_skus.id>) so each product has a
// stable URL and Product/Offer structured data. Buying hands off to the
// homepage's existing ?buy=<sku_id> flow (reserve + cart), unchanged.
(async function () {
  const SB = 'https://eglanmhhcccsuhbxywua.supabase.co';
  const SK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnbGFubWhoY2Njc3VoYnh5d3VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4Nzc2MDQsImV4cCI6MjA5MDQ1MzYwNH0.0qjzkMVVajqMkx7SM-hhd6J62zVVFduVDbdr6juiNgo';
  const root = document.getElementById('pd-root');
  const id = new URLSearchParams(location.search).get('id');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const get = t => fetch(`${SB}/rest/v1/${t}`, { headers: { apikey: SK, Authorization: 'Bearer ' + SK } }).then(r => r.ok ? r.json() : []);
  const notFound = () => {
    const m = document.createElement('meta'); m.name = 'robots'; m.content = 'noindex'; document.head.appendChild(m);
    root.innerHTML = '<p class="wv-empty">This piece isn\'t available. <a href="sarees/">Browse all weaves</a>.</p>';
  };
  if (!id || !/^[0-9a-f-]{36}$/i.test(id)) return notFound();
  let au = false;
  try { au = localStorage.getItem('msh_currency') === 'AU'; } catch (e) {}
  try {
    const [skus, units, st] = await Promise.all([
      get(`inventory_skus?id=eq.${id}&select=id,sku_code,name,display_material,display_variant,photos,sale_price,mrp,sale_price_aud,india_available,au_available`),
      get(`inventory_units?sku_id=eq.${id}&status=eq.available&select=id`),
      get('settings?key=in.(wa_num_in,wa_num_au)&select=key,value'),
    ]);
    const it = skus[0];
    if (!it) return notFound();
    if (au && !it.au_available && it.india_available) au = false;
    if (!au && !it.india_available && it.au_available) au = true;
    const wa = {}; st.forEach(s => wa[s.key] = s.value);
    const waNum = ((au ? wa.wa_num_au : wa.wa_num_in) || '918709525218').replace(/\D/g, '');
    const inStock = units.length > 0;
    const nm = it.name + (it.display_variant && it.display_variant !== '-' ? ' (' + it.display_variant + ')' : '');
    const price = au ? Number(it.sale_price_aud || 0) : Number(it.sale_price || it.mrp || 0);
    const mrp = au ? 0 : Number(it.mrp || 0);
    const cur = au ? 'AUD' : 'INR', sym = au ? 'A$' : '₹', loc = au ? 'en-AU' : 'en-IN';
    const photos = it.photos || [];
    const url = `https://meensha.in/product.html?id=${it.id}`;
    const desc = `${nm}${it.display_material ? ' in ' + it.display_material : ''} from Meensha — heritage Indian weaves sourced weaver-direct.`;

    document.title = `${nm} — Meensha`;
    document.querySelector('meta[name="description"]').content = desc;
    document.querySelector('link[rel="canonical"]').href = url;
    document.querySelector('meta[property="og:title"]').content = `${nm} — Meensha`;
    if (photos[0]) document.querySelector('meta[property="og:image"]').content = photos[0];
    document.getElementById('pd-crumb').textContent = nm;

    const ld = {
      '@context': 'https://schema.org', '@type': 'Product', name: nm, sku: it.sku_code,
      description: desc, image: photos.length ? photos : ['https://meensha.in/og-image.jpg'], brand: { '@type': 'Brand', name: 'Meensha' },
      material: it.display_material || undefined,
      offers: { '@type': 'Offer', url, priceCurrency: cur, price: price.toFixed(2),
        availability: inStock ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock',
        itemCondition: 'https://schema.org/NewCondition', seller: { '@type': 'Organization', name: 'Meensha' } },
    };
    const s = document.createElement('script'); s.type = 'application/ld+json'; s.textContent = JSON.stringify(ld);
    document.head.appendChild(s);

    const alt = nm + (it.display_material ? ' – ' + it.display_material : '');
    const waMsg = encodeURIComponent(`Hi Meensha! Interested in: ${nm} — ${it.sku_code}\nCould you share details? 🙏`);
    root.innerHTML = `<div class="pd">
      <div>
        <div class="pd-main">${photos[0] ? `<img id="pd-img" src="${esc(photos[0])}" alt="${esc(alt)}">` : ''}</div>
        ${photos.length > 1 ? `<div class="pd-thumbs">${photos.map((p, i) => `<img src="${esc(p)}" alt="${esc(alt)} — photo ${i + 1}" loading="lazy" data-src="${esc(p)}">`).join('')}</div>` : ''}
      </div>
      <div>
        <h1>${esc(nm)}</h1>
        ${it.display_material ? `<p class="pd-meta">Material: ${esc(it.display_material)}</p>` : ''}
        <p class="pd-price">${sym}${price.toLocaleString(loc)}${mrp > price ? `<span class="pd-mrp">${sym}${mrp.toLocaleString(loc)}</span>` : ''}</p>
        ${inStock ? '' : '<p class="pd-sold">Sold out — ask us about similar pieces</p>'}
        <div class="pd-btns">
          ${inStock ? `<a class="pd-btn primary" href="./?buy=${encodeURIComponent(it.id)}">Add to Cart</a>` : ''}
          <a class="pd-btn" href="https://wa.me/${waNum}?text=${waMsg}" target="_blank" rel="noopener">Ask on WhatsApp</a>
        </div>
      </div>
    </div>`;
    root.querySelectorAll('.pd-thumbs img').forEach(t => t.addEventListener('click', () => { document.getElementById('pd-img').src = t.dataset.src; }));
  } catch (e) {
    root.innerHTML = '<p class="wv-empty">Couldn\'t load this piece right now. Please try again shortly.</p>';
  }
})();
</script>
</body>
</html>
