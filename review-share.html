<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A review of Meensha</title>
<meta name="robots" content="noindex">
<!-- OG tags are static: this page is client-rendered, so link previews (WhatsApp etc.) cannot show the per-review name/stars. -->
<meta property="og:title" content="★★★★★ A review of Meensha">
<meta property="og:description" content="See what our customers say about Meensha handloom sarees.">
<meta property="og:image" content="https://meensha.in/meensha_logo_eng.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#080705; --gold:#c9a84c; --gold-light:#e8c97a; --cream:#f0e8d5; --text:#d4c9b0; --text-dim:#8a7d64; --divider:rgba(201,168,76,0.18); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Jost',sans-serif; font-weight:300; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px 40px; }
  header { text-align:center; margin-bottom:22px; }
  header img { height:64px; }
  .frame { width:100%; max-width:440px; border:1px solid var(--divider); border-radius:10px; padding:26px 20px; background:rgba(232,213,163,.04); text-align:center; }
  .stars { color:#f0c419; font-size:34px; letter-spacing:4px; margin-bottom:14px; }
  .quote { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:21px; line-height:1.5; color:var(--cream); margin-bottom:14px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .who { overflow-wrap:anywhere; font-family:'Cinzel',serif; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-light); margin-bottom:20px; }
  .media { display:block; max-width:100%; max-height:70vh; margin:0 auto; border-radius:8px; border:1px solid var(--divider); }
  iframe { width:100%; height:560px; border:1px solid var(--divider); border-radius:8px; background:#000; }
  .actions { margin-top:20px; display:flex; flex-direction:column; gap:12px; align-items:center; }
  .btn { display:inline-block; padding:12px 26px; background:var(--gold); color:#0E0A04; font-family:'Cinzel',serif; font-size:12px; letter-spacing:.14em; text-transform:uppercase; text-decoration:none; border-radius:4px; font-weight:600; }
  .alt { color:var(--gold-light); font-size:13px; }
  .watch { width:100%; height:200px; border:1px solid var(--divider); border-radius:8px; background:linear-gradient(135deg,#1a1208,#0e0a04); color:var(--gold-light); font-family:'Cinzel',serif; font-size:14px; letter-spacing:.1em; cursor:pointer; }
  .says { width:100%; max-width:440px; margin-top:22px; }
  .says h2 { font-family:'Cinzel',serif; font-weight:400; font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-light); text-align:center; margin-bottom:12px; }
  .hl { border-left:2px solid var(--gold); background:rgba(232,213,163,.04); padding:12px 14px; margin-bottom:10px; border-radius:0 6px 6px 0; }
  .chip { display:inline-block; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); border:1px solid var(--divider); border-radius:10px; padding:1px 8px; margin-bottom:6px; }
  .hlq { font-family:'Cormorant Garamond',serif; font-size:18px; line-height:1.4; color:var(--cream); overflow-wrap:anywhere; }
  .hla { font-size:12px; color:var(--text-dim); margin-top:4px; }
  .foot { margin-top:26px; font-size:12px; color:var(--text-dim); text-align:center; }
  .foot a { color:var(--gold-light); }
  .msg { color:var(--text-dim); font-style:italic; padding:30px 0; }
  .hint { font-size:11px; color:var(--text-dim); margin-top:8px; }
</style>
</head>
<body>
<header><a href="https://meensha.in/"><img src="logo.svg" alt="Meensha"></a></header>
<div class="frame" id="frame"><p class="msg">Loading…</p></div>
<section class="says" id="says"></section>
<p class="foot">Want a comment removed? <a href="https://wa.me/918709525218" target="_blank" rel="noopener">Message us on WhatsApp</a></p>

<script>
const _SB = 'https://eglanmhhcccsuhbxywua.supabase.co';
const _SK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnbGFubWhoY2Njc3VoYnh5d3VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4Nzc2MDQsImV4cCI6MjA5MDQ1MzYwNH0.0qjzkMVVajqMkx7SM-hhd6J62zVVFduVDbdr6juiNgo';
async function spFetch(t,q=''){const r=await fetch(`${_SB}/rest/v1/${t}${q}`,{headers:{'apikey':_SK,'Authorization':'Bearer '+_SK}});if(!r.ok)return[];try{return await r.json();}catch{return[];}}

// Same strict rule as admin.html's parseIgLink; the embed URL is built only from a validated shortcode.
const IG_RE = /^https:\/\/(?:www\.|m\.)?instagram\.com\/(?:(?!share\/)[A-Za-z0-9._]{1,30}\/)?(p|reel|reels|tv)\/([A-Za-z0-9_-]{5,20})\/?(?:[?#]\S*)?$/i;
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

function notFound() {
  const f = document.getElementById('frame');
  f.innerHTML = '<p class="msg">This review is not available.</p><div class="actions"><a class="btn" href="https://meensha.in/">Shop our sarees</a></div>';
}

(async function () {
  const id = new URLSearchParams(location.search).get('id') || '';
  if (!UUID_RE.test(id)) return notFound();
  // Explicit safe columns only. Prefer the public_reviews view (has highlights); fall back to the table until the view exists.
  const base = 'id,rating,review_text,display_name,source,ig_permalink,photo_url,created_at,status';
  const MEDIA_RE = /^https:\/\/eglanmhhcccsuhbxywua\.supabase\.co\/storage\/v1\/object\/public\/review-media\/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.(jpg|jpeg|png|webp|mp4|webm|mov)$/;
  const filt = `&id=eq.${id}&status=eq.approved&source=in.(instagram_link,story_upload)&limit=1`;
  let rows = await spFetch('public_reviews', `?select=${base},comment_highlights${filt}`);
  if (!rows.length) rows = await spFetch('reviews', `?select=${base}${filt}`);
  const r = rows[0];
  if (!r) return notFound();
  const story = r.source === 'story_upload';
  const ig = !story && IG_RE.exec(r.ig_permalink || '');
  if (!story && !ig) return notFound();
  // Story uploads: media only if the URL is one of OUR review-media storage URLs (type comes from the extension).
  if (story && !MEDIA_RE.test(r.photo_url || '')) return notFound();
  const k = ig ? ig[1].toLowerCase() : '', kind = k === 'p' || k === 'tv' ? 'p' : 'reel';
  const code = ig ? ig[2] : '';
  const n = Math.max(0, Math.min(5, parseInt(r.rating) || 0));

  const f = document.getElementById('frame');
  f.textContent = '';
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  f.appendChild(mk('div', 'stars', '★'.repeat(n) + '☆'.repeat(5 - n)));
  if (r.review_text) f.appendChild(mk('p', 'quote', '“' + r.review_text + '”'));
  f.appendChild(mk('p', 'who', r.display_name || 'Meensha customer'));

  if (story) {
    const isVid = /\.(mp4|webm|mov)$/.test(r.photo_url);
    const m = document.createElement(isVid ? 'video' : 'img');
    m.src = r.photo_url;
    m.className = 'media';
    if (isVid) { m.controls = true; m.playsInline = true; m.preload = 'metadata'; } else { m.alt = 'Review by ' + (r.display_name || 'a Meensha customer'); m.loading = 'lazy'; }
    f.appendChild(m);
  } else {
    // Instagram's official embed, loaded only on tap (privacy: Instagram sees nothing until the visitor chooses).
    // Browsers block autoplay with sound, so the visitor taps play inside the embed to hear the music.
    // referrerpolicy is left at the default: not verified that the embed works with no-referrer.
    const hint = mk('p', 'hint', 'Opens Instagram\u2019s own player.');
    const ph = mk('button', 'watch', '\u25B6 Watch the post with sound');
    ph.type = 'button';
    ph.onclick = () => {
      const fr = document.createElement('iframe');
      fr.src = `https://www.instagram.com/${kind}/${code}/embed/`;
      fr.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-presentation');
      fr.setAttribute('allowfullscreen', '');
      fr.title = 'Instagram post';
      ph.replaceWith(fr);
      hint.textContent = 'Tap play inside the post to hear the music.';
    };
    f.appendChild(ph);
    f.appendChild(hint);
  }

  const act = mk('div', 'actions');
  const shop = mk('a', 'btn', 'Shop our sarees'); shop.href = 'https://meensha.in/';
  if (ig) {
    const view = mk('a', 'alt', 'View on Instagram'); view.href = `https://www.instagram.com/${kind}/${code}/`; view.target = '_blank'; view.rel = 'noopener';
    act.append(shop, view);
  } else act.append(shop);
  f.appendChild(act);

  // Owner-approved comment highlights (from the view only; empty before the migration).
  const hl = (Array.isArray(r.comment_highlights) ? r.comment_highlights : []).slice(0, 6).filter(h => h && typeof h.text === 'string' && h.text);
  if (hl.length) {
    const sec = document.getElementById('says');
    sec.appendChild(mk('h2', null, 'What people are saying'));
    hl.forEach(h => {
      const c = mk('div', 'hl');
      c.appendChild(mk('span', 'chip', String(h.theme || 'other')));
      c.appendChild(mk('p', 'hlq', '\u201C' + h.text.slice(0, 200) + '\u201D'));
      if (h.author) c.appendChild(mk('p', 'hla', '\u2014 ' + String(h.author).slice(0, 40)));
      sec.appendChild(c);
    });
  }
})();
</script>
</body>
</html>
