# GitHub Pages (Jekyll) build config.
# The whole repo is the website, so anything not listed here is publicly served.
# Keep internal docs, SQL, scripts and server code OUT of the published site.
# docs/MEDIUM_POST_02_draft.md and docs/ARTISANS_BLOG_DRAFT_01.md stay served:
# admin.html's Content Drafts viewer fetches them.
exclude:
  - "setup"
  - "supabase"
  - "scripts"
  - "chatbot/kb"
  - "chatbot/server"
  - "chatbot/README.md"
  - "TODO.md"
  - "RESTORE.md"
  - "README.md"
  - "STAGING_SEPARATION_PROPOSAL.md"
  - "IDEA.md"
  - "docs/BLOG_DRAFT_building_meensha.md"
